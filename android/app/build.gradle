apply plugin: 'com.android.application'

android {
    namespace 'com.ruhtoonstudio.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.ruhtoonstudio.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0"
    }

    signingConfigs {
        ruhvibes {
            // v1 fix 2026-09-30: sign with the persistent Ruhvibes keystore
            // (~/workspace/remix-app/keystore/ruhvibes.jks) instead of the
            // auto-generated debug key, which changes on every VM wipe and
            // breaks update-installs. Passwords live in ~/.gradle/gradle.properties.
            storeFile file("/home/hatch/workspace/remix-app/keystore/ruhvibes.jks")
            storePassword project.findProperty('ruhvibesStorePassword')
            keyAlias 'ruhvibes'
            keyPassword project.findProperty('ruhvibesKeyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.ruhvibes
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    // Explicit (already cached transitively): FileProvider for the share sheet.
    implementation 'androidx.core:core:1.13.0'
}

// kotlin-stdlib:1.8.22 (pulled in by androidx) already contains the
// kotlin-stdlib-jdk7/jdk8 classes; drop the stale duplicates to avoid
// "Duplicate class" build errors.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}
