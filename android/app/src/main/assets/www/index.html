<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a1040">
  <title>RuhToon Studio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header>
    <div class="brand-mark">R</div>
    <div><h1>RuhToon Studio</h1><p id="appTag">Build a character. Give it a voice.</p></div>
    <div class="spacer"></div>
    <button id="langBtn" class="icon-btn" title="Language">EN</button>
  </header>

  <main>
    <div id="recoverNote" class="panel hidden"></div>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="stageFallback">Loading 3D stage…</div>
      <div id="stageBar">…</div>
    </div>
    <div id="screen"></div>
  </main>

  <div id="toast"></div>
  <nav id="tabbar"></nav>
  <footer>RuhToon Studio · offline · projects stay on this device</footer>

  <script src="js/lib/three.min.js"></script>
  <script src="js/lib/GLTFLoader.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/project.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
